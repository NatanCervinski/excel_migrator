{% extends "base.html" %} {% block content %}
<h1>Arquivos Processados</h1>
<p>
  Os arquivos foram processados com sucesso. Clique nos links abaixo para
  baixá-los:
</p>
<ul>
  {% for file in files %}
  <li>
    <a href="{{ url_for('main.download_file', filename=file) }}">{{ file }}</a>
  </li>
  {% endfor %}
  <p>
    Ou
    <a href="{{ url_for('main.download_all') }}"
      >baixe todos os arquivos em um único arquivo zip</a
    >.
  </p>
</ul>
{% endblock %}
